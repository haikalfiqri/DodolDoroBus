<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코덱스의 시험 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;800&family=Press+Start+2P&display=swap">
<style>
/* 코덱스의 시험 (v3 midterm prototype) — built on Wafi's quiz duel prototype. Site pages (hub, map, spirit, mail, shop, admin) + full-screen pixel game screens (onboard, intro, battle, result). */
:root{
 --ink:#14213d;--navy:#27446f;--navy2:#1c3358;--paper:#fffaf0;--line:#d9e5f4;
 --blue:#3b82f6;--blue2:#2563eb;--blueL:#e8f1ff;--sky:#c6e6fb;--grass:#b9e2b3;--grass2:#a5d49d;
 --orange:#f97316;--yellow:#fbbf24;--green:#10b981;--red:#ef4444;--mint:#14b8a6;--purple:#8b5cf6;
 --bg:#f3f7fc;--text:#1a2438;--mute:#6b7a92;--card:#fff;
 --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --disp:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;--pix:'Press Start 2P',monospace;
 color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.screen{min-height:100%}
.px{display:block;width:100%;height:100%}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* site header */
.sh{background:#fff;border-bottom:1px solid var(--line)}
.shrow{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{display:flex;align-items:center;gap:6px;font:800 20px var(--font);color:var(--blue2);letter-spacing:.02em;cursor:pointer;text-decoration:none}
.logo svg{width:26px;height:18px}
.shr{display:flex;align-items:center;gap:10px}
.cell{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:#d8f7e6;color:#0b6b43;font-weight:700;border:2px solid transparent;transition:.3s}
.cell i{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.cell.pulse{border-color:#6ee7b7;box-shadow:0 0 0 5px #a7f3d0aa}
.cell s{text-decoration:none;color:#059669;margin-left:2px}
.lv{padding:4px 12px;border-radius:99px;background:var(--blueL);color:var(--blue2);font-weight:700;font-size:12px}
.icon-btn{position:relative;background:none;border:0;font-size:20px;padding:4px 6px}
.icon-btn u{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font:700 10px var(--font);text-decoration:none;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center}
.me-menu{position:relative}
.me-btn{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border:1px solid var(--line);background:#fff;border-radius:99px;font-weight:700}
.me-btn .face{width:28px;height:28px;border-radius:50%;background:#fde7ef;overflow:hidden}
.dd{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #1c335822;padding:6px;min-width:190px;z-index:30}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:13px}
.dd button:hover{background:var(--blueL)}
.nav{display:flex;gap:6px;overflow-x:auto;border-top:1px solid #eef3fa;scrollbar-width:none}
.nav a{padding:13px 16px;color:var(--mute);font-weight:500;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nav a.on{color:var(--ink);font-weight:800;border-color:var(--blue)}
.band{background:#e1eefb;padding:26px 0 24px}
.band h1{margin:0;font-size:28px;font-weight:800;color:var(--ink)}
.band p{margin:6px 0 0;color:#566a88}
.page{padding:26px 0 60px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:22px}
.chips .l{display:flex;gap:8px;flex-wrap:wrap}
.chip-b{border:0;background:transparent;padding:8px 16px;border-radius:99px;font-weight:700;color:#3d4c66}
.chip-b.on{background:var(--blueL);color:var(--blue2)}
.chip-b em{font-style:normal;background:var(--orange);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:5px}
.search{color:var(--text);border:1px solid var(--line);border-radius:99px;padding:10px 18px;width:min(100%,300px);background:#fff;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,300px));gap:18px}
.gcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px}
.gcard.feat{border:2px solid var(--blue);box-shadow:0 8px 24px #3b82f633}
.thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:var(--sky)}
.thumb.ph{background:linear-gradient(135deg,#c7d2fe,#bae6fd);display:grid;place-items:center;color:#4f6bd8;font-weight:700}
.new{position:absolute;top:8px;right:8px;background:var(--blue);color:#fff;border-radius:99px;padding:2px 12px;font-size:11px;font-weight:800;z-index:3}
.meta{font-size:11px;color:var(--mute);padding:4px 6px 0}.meta b{color:var(--blue2)}
.gcard h3{margin:0;padding:0 6px;font-size:18px;font-weight:800}
.gcard p{margin:0;padding:0 6px;color:#5a6b86;font-size:12.5px}
.gfoot{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:12px;font-weight:700}
.bonus{background:#fff1e0;color:#c2570c;border:1px solid #fdc88f;border-radius:99px;padding:3px 10px;font-size:11px}
.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;padding:12px 16px;font-size:14px;box-shadow:0 3px 0 var(--blue2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue2)}
.btn:disabled{background:#b7c4d8;box-shadow:0 3px 0 #98a6bd;cursor:not-allowed}
.btn.out{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.big{padding:15px 18px;font-size:16px;border-radius:12px}
/* mini scene */
.mini{position:absolute;inset:0;container-type:size;background:linear-gradient(var(--sky) 0 62%,var(--grass) 62%)}
.mini .pl{position:absolute;border-radius:50%;background:var(--grass2);box-shadow:inset 0 -2px 0 #0001}
.mini .p1{left:2%;bottom:-8%;width:46%;height:26%}.mini .p2{right:3%;top:42%;width:36%;height:16%}
.mini .s1{position:absolute;left:8%;bottom:-14%;height:66%;aspect-ratio:16/22}
.mini .s2{position:absolute;right:12%;top:6%;height:56%;aspect-ratio:16/22}
.mini .vs{position:absolute;left:46%;top:24%;font:400 28cqh var(--disp);color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:skew(-6deg)}
.mini .cl{position:absolute;top:10%;left:12%;width:16%;height:6%;background:#fff;border-radius:99px;opacity:.9}
/* lobby */
.lob{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.pnl{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.pnl h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pnl h4 small{font-weight:400;color:var(--mute)}
.lban{position:relative;aspect-ratio:16/6.4;overflow:hidden;border-radius:14px 14px 0 0}
.lban .tag{position:absolute;left:14px;top:14px;z-index:3;background:var(--blue2);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:4px 12px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.lmain{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lbody{padding:18px 22px 22px}
.lbody .k{color:var(--blue2);font-weight:800;font-size:12px}
.lbody h2{margin:4px 0;font-size:28px;font-weight:800}
.lbody .sub{color:#566a88;font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 12px}
.mode{border-radius:14px;padding:16px 18px;text-align:left;border:2px solid var(--line);background:#fff;font-weight:800;font-size:16px;line-height:1.35}
.mode small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:3px}
.mode.pri{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 0 var(--blue2)}
.mode:disabled{opacity:.55;cursor:not-allowed}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rules div{background:var(--blueL);border-radius:10px;padding:10px 12px;font-weight:800}
.rules small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.rk{list-style:none;margin:0;padding:0}
.rk li{display:flex;gap:10px;padding:7px 8px;border-radius:8px;font-weight:700}
.rk li span:first-child{width:18px;color:var(--mute);font-weight:500}.rk li b{flex:1}.rk li.me{background:var(--blueL)}
.note{background:#fff3e2;border:1px solid #fdc88f;color:#9a4a0a;border-radius:12px;padding:11px 14px;text-align:center;font-weight:700}
.past{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.past a{color:var(--mute);cursor:pointer;font-size:12px}.past a:hover{color:var(--blue2)}
/* mail */
.mrow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #eef3fa}
.mrow.fresh{border-left:5px solid var(--green);background:#f3fcf7}
.mrow .ic{width:46px;height:46px;border-radius:10px;background:var(--blueL);display:grid;place-items:center;font-size:22px;flex:none}
.mrow .tx{flex:1;min-width:0}.mrow .tx b{display:block}.mrow .tx small{color:var(--mute)}
.mrow .amt{color:#047857;font-weight:800;font-size:16px}
.mrow.done{color:#9aa6b8}
.gbtn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:800}
.gbtn:disabled{background:#98a5ba}
.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.cele{background:#e9fbf1;border:1px solid #a7e8c6;border-radius:16px;padding:18px;text-align:center}
.cele .e{font-size:36px}.cele b{display:block;font-size:20px;margin:4px 0}
.shopmini div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef3fa;font-size:13px}
/* shop */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item .ic{font-size:34px}.item b{font-size:14px}.item small{color:var(--mute)}
.item.eq{border:2px solid var(--blue)}
.led div{display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;border-bottom:1px solid #eef3fa}
/* teacher */
.tbadge{background:var(--ink);color:#fff;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left}
.tile small{color:var(--mute);display:block}.tile b{font-size:26px;font-weight:800}
.tile.act{border-color:#f5b85c;cursor:pointer}
.tbl{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.tbl th{background:#f3f7fc;text-align:left;padding:11px 14px;color:var(--mute);font-weight:500}
.tbl th,.tbl td.nw{white-space:nowrap}.tbl td{padding:11px 14px;border-top:1px solid #eef3fa;vertical-align:top}
.tbl tr.pend td{background:#fffaea}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.q{background:#dbeafe;color:#1e4fb4}.pill.p{background:#ffe5cf;color:#b8500b}
.sm{border:0;border-radius:99px;padding:5px 12px;font-weight:800;font-size:12px;margin-right:4px;background:#e5eaf3;color:#33415c}
.sm.g{background:var(--green);color:#fff}.sm.r{background:#fde2e2;color:#b91c1c}
.st-ok{color:#047857;font-weight:800}.st-pd{color:#b8500b;font-weight:800}.st-no{color:#9aa6b8;font-weight:800}
/* modal / toast */
.mod{position:fixed;inset:0;background:#0b1630aa;display:grid;place-items:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:16px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0006}
.mbox h3{margin:0 0 12px}
.mbox label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.mbox input,.mbox select,.mbox textarea{color:var(--text);background:#fff;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mbox .opt{display:flex;gap:8px;align-items:center;padding:8px 4px;font-weight:500;margin:0}
.mbox .opt input{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;z-index:200;box-shadow:0 8px 24px #0005;max-width:90vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
/* ===== game screens ===== */
.game{position:fixed;inset:0;overflow:hidden;z-index:20}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:#e6efff;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));font-weight:700;font-size:13px}
.topbar .c{flex:1;text-align:center}
.tmr{display:flex;align-items:center;gap:8px}.tbar{width:110px;height:10px;background:#ffffff33;border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--yellow)}.tbar i.pw{background:var(--orange)}.tbar i.lo{background:var(--red)}
.tb-btn{background:#ffffff1f;border:0;color:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
#s-battle{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.scene{position:relative;container-type:size;background:linear-gradient(#bfe3fb 0 58%,#b9e2b3 58%);overflow:hidden}
.scene.night{background:linear-gradient(#1b2a5e 0 58%,#2f5f6a 58%)}
.scene .cloud{position:absolute;height:5cqh;background:#fff;border-radius:99px;opacity:.85}
.scene .plat{position:absolute;border-radius:50%;background:#9fd596;box-shadow:inset 0 -.8cqh 0 #0002}
.scene.night .plat{background:#3d7d7b}
.plat.po{right:6%;top:36%;width:36%;height:15%}.plat.pm{left:2%;bottom:-6%;width:44%;height:24%}
.spr{position:absolute}
.spr.opp{right:15%;top:8%;height:40cqh;aspect-ratio:16/22}.spr.me{left:9%;bottom:-8%;height:56cqh;aspect-ratio:16/22}
.spr{transition:transform .25s}
.spr.lungeme{animation:lme .5s}.spr.lungeopp{animation:lop .5s}
@keyframes lme{40%{transform:translate(14cqw,-9cqh)}}
@keyframes lop{40%{transform:translate(-14cqw,9cqh)}}
.spr.hit{animation:hit .7s}
@keyframes hit{0%,40%,80%{filter:brightness(2.4) saturate(.2)}20%,60%{filter:none;transform:translateX(-1.5cqw)}100%{filter:none}}
.spr.ko{transform:rotate(80deg) translateY(10cqh);opacity:0;transition:all 1s}
.panel{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 #14213d44;padding:8px 14px;width:min(300px,42%)}
.panel.o{left:3%;top:5%}.panel.m{right:3%;bottom:6%}
.panel .nm{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px}
.panel .nm span{font-size:12px;font-weight:500;color:#555}
.hp{display:flex;align-items:center;gap:6px;margin:4px 0}.hp em{font:800 10px var(--font);background:var(--yellow);border:2px solid var(--ink);border-radius:5px;padding:0 4px;font-style:normal}
.hpbar{position:relative;flex:1;height:12px;border-radius:99px;background:var(--navy2);border:2px solid var(--ink);overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;transition:width .8s}.hpbar .lost{background:#f9a8b4;transition:width .9s .6s}.hpbar .fill{background:var(--green)}.hpbar .fill.mid{background:var(--yellow)}.hpbar .fill.low{background:var(--red)}
.panel .hn{text-align:right;font-size:12px;font-weight:700}
.panel .pw{font-size:11px;color:#555}.panel .pw b{color:var(--orange)}.panel .pw b.off{color:#bbb}
.callout{position:absolute;left:44%;top:6%;background:var(--blue2);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:3px 3px 0 #14213d55;animation:pin .3s;max-width:48%}
.callout.pw{background:var(--orange)}.callout.gr{background:#475a7a}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.pop{position:absolute;font:400 clamp(30px,9cqh,64px) var(--disp);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;color:var(--yellow);animation:popin .45s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none;white-space:nowrap;z-index:5}
.pop.bad{color:#ff8a8a}.pop.cnt{color:#f9a8d4;font-size:clamp(20px,6cqh,40px)}.pop.unk{color:#c4b5fd}
@keyframes popin{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-7deg)}}
.spark{position:absolute;font-size:4cqh;animation:spk 1s both}@keyframes spk{from{opacity:0;transform:scale(0)}50%{opacity:1}to{opacity:0;transform:scale(1.5) rotate(90deg)}}
.bottom{background:var(--navy2);padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));max-height:52vh;overflow:auto;border-top:4px solid #0f1d38}
.bp{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.bp.one{grid-template-columns:1fr}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:12px 16px;min-width:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;text-align:left;background:#fff;border:3px solid #cbd5e1;border-radius:10px;padding:8px 12px;min-height:72px;transition:.1s}
.card:hover{border-color:#94a3b8}
.card.sel{border-color:var(--blue);background:#f3f8ff}.card.sel.power{border-color:var(--orange);background:#fff7ef}
.card.sel::before{content:"▶";position:absolute;left:-17px;top:50%;transform:translateY(-50%);color:var(--yellow);font-size:14px;-webkit-text-stroke:1px var(--ink)}
.cards.gold .card{border-color:#e9b949;box-shadow:inset 0 0 0 2px #fde68a}
.ct{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:3px}
.tg{background:var(--blue);color:#fff;border-radius:5px;padding:1px 8px;font-weight:800}.tg.pw{background:var(--orange)}
.card .q{font-weight:700;font-size:13.5px;line-height:1.35}
.side h3{margin:0 0 4px;font-size:15px}.side .pwr{font-size:13px;margin:4px 0}.side .pwr b{color:var(--orange)}
.side .warn{font-size:12px;color:#b45309;font-weight:700;margin:6px 0 10px}
.go{background:var(--orange);border:0;color:#fff;font-weight:800;padding:9px 20px;border-radius:8px;box-shadow:0 4px 0 #b9500a;font-size:15px}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #b9500a}.go.bl{background:var(--blue);box-shadow:0 4px 0 var(--blue2);width:100%}
.qh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px;flex-wrap:wrap}
.qh .tg{background:#dbeafe;color:#1e4fb4}.qh .tg.pw{background:#ffe5cf;color:#b8500b}
.qq{margin:2px 0 10px;font-size:clamp(15px,2.4vw,19px);font-weight:800;line-height:1.35}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-weight:700;font-size:15px;text-align:left}

function ac(){if(!AU.ctx){try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return AU.ctx}
function tone(f,d=.1,type='square',v=.05,delay=0,to=0){
 if(!AU.on||!f)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
 click:()=>tone(720,.05),sel:()=>tone(520,.06,'square',.04),
 go:()=>{tone(300,.12,'sawtooth',.06,0,900)},
 hit:()=>{tone(220,.25,'sawtooth',.08,0,60);tone(120,.2,'square',.06,.05,50)},
 block:()=>{tone(880,.08,'square',.06);tone(1320,.14,'square',.05,.07)},
 bad:()=>{tone(300,.15,'square',.05);tone(200,.25,'square',.05,.12)},
 tick:()=>tone(990,.04,'square',.03),
 splash:()=>{tone(392,.1);tone(523,.1,'square',.05,.1);tone(659,.18,'square',.05,.2)},
 win:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.18,'square',.05,i*.13)),
 lose:()=>[392,349,330,262].forEach((f,i)=>tone(f,.28,'triangle',.07,i*.2)),
 coin:()=>{tone(988,.07);tone(1319,.25,'square',.05,.07)}
};

/* ---------- ui helpers ---------- */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toastBox').appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="mod" data-act="modalbg"><div class="mbox" role="dialog" aria-modal="true">${html}</div></div>`;m.hidden=false;timerPause(true)}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';timerPause(false)}
async function splash(t,sub=''){const s=$('#splash');s.innerHTML=`<div>${t}${sub?`<small>${sub}</small>`:''}</div>`;s.hidden=false;SFX.splash();const id=M&&M.id;await sleep(1000);s.hidden=true;return !M||M.id===id}

/* ---------- timer ---------- */
const T={id:null,total:0,left:0,cb:null,last:0,paused:false,lastSec:0};
function timerStart(sec,label,cb,power){
 timerStop();T.total=sec*1000;T.left=T.total;T.cb=cb;T.last=performance.now();T.lastSec=sec;
 $('#tmr').style.visibility='visible';$('#tLabel').textContent=label;$('#tFill').className=power?'pw':'';
 timerUi();T.id=setInterval(()=>{const n=performance.now();if(T.paused||document.hidden){T.last=n;return}
  T.left-=n-T.last;T.last=n;if(T.left<=0){T.left=0;timerUi();const cb=T.cb;timerStop(true);cb&&cb();return}
  timerUi();const s=Math.ceil(T.left/1000);if(s<=5&&s!==T.lastSec){T.lastSec=s;SFX.tick()}},100)}
function timerUi(){const f=$('#tFill');f.style.width=(T.left/T.total*100)+'%';if(T.left<5000)f.classList.add('lo');$('#tSec').textContent=Math.ceil(T.left/1000)+'초'}
function timerStop(keep){if(T.id){clearInterval(T.id);T.id=null}T.cb=null;if(!keep)$('#tmr').style.visibility='hidden'}
function timerPause(p){T.paused=p;T.last=performance.now()}

function tEditModal(id){

 const type=$('#fT').value,cat=$('#fC').value,p=$('#fP').value.trim(),a=$('#fA').value.trim(),ex=$('#fE').value.trim()||'관리자가 만든 미션이에요.',st=$('#fS').value;
 if(!p){toast('문제를 입력해 주세요');return}

 if(cat==='컴퓨팅'&&type!=='order'){toast('컴퓨팅(코드 웨이브)은 명령 순서 미션이에요');return}
 if(cat!=='컴퓨팅'&&type==='order'){toast('명령 순서 미션은 컴퓨팅 분야예요');return}

 if(type!=='order'&&!a){toast('정답을 입력해 주세요');return}
 let m=id?MISS.find(x=>x.id===id):null;if(!m){m={id:'n'+Date.now(),type};MISS.push(m)}
 m.cat=cat;m.prompt=p;m.ex=ex;m.status=st;
 if(type==='mc'){const w=$('#fW').value.split(',').map(s=>s.trim()).filter(Boolean);while(w.length<3)w.push('보기 '+(w.length+2));m.choices=[a,...w.slice(0,3)]}

/* ---------- battle: spirit vs anomaly bot (no other players, no AI grading) ---------- */
let M=null,MID=0,SEL=0;
const alive=id=>M&&M.id===id;
function openStage(id){
 if(!unlocked(id)){SFX.bad();toast('앞 스테이지를 먼저 클리어하면 열려요');return}
 const st=stageById(id);S.justCleared=false;
 M={id:++MID,st,energy:100,gauge:st.g,round:1,turn:'me',combo:1,used:new Set(),hint:false,cur:null,over:null,hits:0,tries:0,dodges:0,dtries:0};showIntro()}
function drawMission(f){let c=MISS.filter(m=>m.status==='approved'&&f(m)&&!M.used.has(m.id));if(!c.length)c=MISS.filter(m=>m.status==='approved'&&f(m));if(!c.length)return null;const m=pick(c);M.used.add(m.id);return m}
const missionFor=sk=>drawMission(m=>m.cat===sk.cat&&(sk.type==='order'?m.type==='order':m.type!=='order'));
function showIntro(){
 const st=M.st;let line=st.line;if(st.id===1)line+='\n\n(네이티: 스킬로 미션을 맞히면 게이지가 내려가! 공격이 오면 O/X로 피해!)';
 $('#s-intro').innerHTML=`<div class="topbar"><span>1장 · ${st.boss?'보스':'스테이지 '+st.id}</span><span>${esc(st.name)}</span></div>
 <div class="vsbg intro"><div class="vsb l"><div class="sp">${sSpirit('yellow')}</div><div class="nb"><b>${esc(S.name)}</b><span>Lv.${S.lv}</span><small>에너지 100 · 스킬 위력 ${power()}</small></div></div>
 <div class="vstxt">VS</div><div class="vsb r"><div class="sp">${sAnom(st)}</div><div class="nb"><b>${esc(st.an)}</b><span>${st.boss?'BOSS':esc(st.cat)}</span><small>불안정 게이지 ${st.g} · 최대 ${st.r}라운드</small></div></div>
 <div class="codex"><div><div class="cx">${sCodex()}</div><small>코덱스</small></div><div id="cxTxt" style="white-space:pre-line"></div></div><button class="btn big vsgo" data-act="beginBattle">시험 시작! ▶</button></div>`;
 go('intro');SFX.splash();const t=$('#cxTxt'),id=M.id;let i=0;const iv=setInterval(()=>{if(!alive(id)||!t.isConnected){clearInterval(iv);return}t.textContent=line.slice(0,++i);if(i>=line.length)clearInterval(iv)},30)}
function beginBattle(){
 go('battle');const st=M.st;
 $('#bArena').textContent='1장 · '+st.name;
 $('#scene').className='scene'+(S.equip.bg==='bg2'?' night':S.equip.bg==='bg1'?' sunset':'');
 $('#sprMe').innerHTML=sSpirit('yellow');$('#sprOpp').innerHTML=sAnom(st);$('#sprMe').className='spr me';$('#sprOpp').className='spr opp';
 $('#sprMe').style.cssText='height:42cqh;bottom:3%;aspect-ratio:1';$('#sprOpp').style.cssText='aspect-ratio:16/12;height:34cqh;top:10%';
 $('#oppInfo').innerHTML=infoHtml('o');$('#meInfo').innerHTML=infoHtml('m');$('#fx').innerHTML='';$('#callout').hidden=true;

function infoHtml(k){return `<div class="nm"><b></b><span></span></div><div class="hp"><em class="${k==='o'?'g':''}">${k==='o'?'불안정':'에너지'}</em><div class="hpbar"><i class="lost" style="width:100%"></i><i class="fill ${k==='o'?'gauge':''}" style="width:100%"></i></div></div><div class="hn"></div><div class="pw"></div>`}
function updatePanels(init){
 const st=M.st;[['o',M.gauge,st.g,st.an,st.boss?'BOSS':'이상 현상'],['m',M.energy,100,S.name,'Lv.'+S.lv]].forEach(([k,v,max,nm,rk])=>{

function setRound(t){$('#bRound').textContent=`라운드 ${Math.min(M.round,M.st.r)} / ${M.st.r} · ${t}`}
function callout(t,cls=''){const c=$('#callout');c.className='callout '+cls;c.textContent=t;c.hidden=false;c.style.animation='none';c.offsetHeight;c.style.animation=''}
const hideCallout=()=>{$('#callout').hidden=true};
async function sleepM(id,ms){await sleep(ms);return alive(id)}
async function startTurn(){
 const id=M.id;hideCallout();updatePanels();
 if(M.turn==='me'){setRound('내 차례');if(!await splash(`ROUND ${M.round}`,M.round===M.st.r?'마지막 라운드!':'스킬을 골라 봐!'))return;if(!alive(id))return;SEL=0;renderSkills();setRound('스킬 고르기')}
 else anomTurn()}
function renderSkills(){
 const sk=mySkills(),dmg=Math.round(power()*M.combo);
 $('#bottom').innerHTML=`<div class="bp"><div class="cards">${sk.map((s,i)=>`<button class="card ${s.type==='order'?'power':''} ${i===SEL?'sel':''}" data-act="pickSkill" data-i="${i}"><div class="ct"><span class="tg ${s.type==='order'?'pw':''}">${s.icon} ${s.name}</span><span>위력 ${dmg}</span></div><div class="q">${s.cat} · ${s.type==='order'?'명령 순서 미션 (30초)':'퀴즈 미션 (20초)'}</div></button>`).join('')}</div>
 <div class="box side"><h3>어떤 스킬을 쓸까?</h3><div class="pwr">콤보 <b>×${M.combo.toFixed(1)}</b> → 성공하면 게이지 <b>-${dmg}</b></div><div class="warn">틀려도 괜찮아요! 이번 공격만 빗나가요.</div><button class="go" data-act="useSkill">스킬 사용! ▶</button></div></div>`}
function useSkill(i){
 if(!M||M.turn!=='me'||M.cur||!$('.cards'))return;const s=mySkills()[i];let m=missionFor(s);
 if(!m)m=drawMission(x=>x.type!=='order'&&x.cat!=='회피');if(!m){toast('승인된 미션이 없어요 (관리자 화면 확인)');return}
 SFX.go();let pool=null;if(m.type==='order'){const n=m.steps.map((_,k)=>k);do{pool=shuffle(n)}while(pool.every((x,k)=>x===k))}
 M.cur={kind:'atk',skill:s,m,order:m.type==='mc'?shuffle([0,1,2,3]):[0,1],pool,picked:[],fixed:0,gone:[]};
 callout(`${S.name}의 ${s.icon} ${s.name}!`);lunge('me');renderMission()}
async function anomTurn(){
 const id=M.id;setRound('이상 현상 차례');callout(`${jo(M.st.an,'이','가')} 꿈틀거린다…`,'gr');
 $('#bottom').innerHTML=`<div class="bp one"><div class="box wait"><div class="spin"></div><b>${esc(jo(M.st.an,'이','가'))} 공격을 준비하고 있어요<span class="dots"></span></b></div></div>`;
 if(!(await sleepM(id,1100)))return;
 const m=drawMission(x=>x.cat==='회피')||drawMission(x=>x.type==='ox');if(!m){M.turn='opp';return next()}
 M.cur={kind:'dodge',m,order:[0,1],gone:[]};callout(`${M.st.an}의 공격! O/X로 피해!`,'pw');lunge('opp');SFX.go();renderMission()}
const choicesOf=c=>c.m.type==='mc'?c.order.map(i=>c.m.choices[i]):['O','X'];
const ansIdx=c=>c.m.type==='mc'?c.order.indexOf(0):(c.m.ans==='O'?0:1);
function renderMission(){
 const c=M.cur,m=c.m,atk=c.kind==='atk',dmg=Math.round(power()*M.combo),hit=M.st.boss?20:15;
 const head=atk?`<span class="tg ${m.type==='order'?'pw':''}">${c.skill.icon} ${c.skill.name} · ${m.cat} · ${typeLabel(m)}</span><span>성공하면 게이지 -${dmg}</span>`
  :`<span class="tg">💨 피하기 · O/X</span><span>맞히면 회피 + 콤보 +0.2 · 틀리면 에너지 -${hit}</span>`;
 const canHint=atk&&!M.hint&&m.type!=='ox'&&!c.done;
 const hintBtn=atk&&m.type!=='ox'?`<div style="margin-top:10px"><button class="sm" data-act="hint" ${canHint?'':'disabled'}>💡 리코의 힌트 (3셀) ${M.hint?'· 이번 배틀에서 사용함':m.type==='order'?'· 첫 단계 알려 줘요':'· 오답 1개 지워요'}</button></div>`:'';
 let body;
 if(m.type==='order')body=orderHtml();
 else{const ch=choicesOf(c);body=`<div class="chs">${ch.map((t,i)=>`<button class="ch ${m.type==='ox'?'ox':''} ${c.gone.includes(i)?'gone':''}" data-act="choice" data-i="${i}">${m.type==='ox'?esc(t):`<b>${i+1}</b>${esc(t)}`}</button>`).join('')}</div>`}
 $('#bottom').innerHTML=`<div class="bp one"><div class="box"><div class="qh">${head}</div><div class="qq">${esc(m.prompt)}</div>${body}${hintBtn}</div></div>`;
 if(!c.started){c.started=true;const sec=!atk?15:m.type==='order'?30:20;setRound(atk?'미션!':'피하기!');timerStart(sec,atk?'미션':'피하기',()=>m.type==='order'?submitOrder(true):submitChoice(-1),m.type==='order')}}
function orderHtml(){
 const c=M.cur,m=c.m;
 return `<div class="ordhint">아래 카드를 순서대로 눌러 칸을 채워요. 채운 칸을 누르면 다시 빠져요.</div>
 <div class="slots">${m.steps.map((_,k)=>{const x=c.picked[k];return `<button class="slot ${x!=null?'on':''}" data-act="unpick" data-k="${k}" ${x==null||k<c.fixed?'disabled':''}><b>${k+1}</b>${x!=null?esc(m.steps[x])+(k<c.fixed?' 💡':''):'<span style="color:#94a3b8">비어 있음</span>'}</button>`}).join('')}</div>
 <div class="chs">${c.pool.filter(x=>!c.picked.includes(x)).map(x=>`<button class="ch" data-act="ordPick" data-x="${x}">${esc(m.steps[x])}</button>`).join('')}</div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn out" data-act="ordReset">↺ 다시</button><button class="go" data-act="ordOk" ${c.picked.length===m.steps.length?'':'disabled'}>확인 ▶</button></div>`}
function ordPick(x){const c=M&&M.cur;if(!c||c.done||c.picked.includes(x))return;c.picked.push(x);SFX.sel();renderMission()}
function unpick(k){const c=M&&M.cur;if(!c||c.done||k<c.fixed)return;c.picked.splice(k,1);SFX.click();renderMission()}
function ordReset(){const c=M&&M.cur;if(!c||c.done)return;c.picked=c.picked.slice(0,c.fixed);renderMission()}
function useHint(){
 const c=M&&M.cur;if(!c||c.done||c.kind!=='atk'||M.hint||c.m.type==='ox')return;
 if(S.cells<3){toast('셀이 부족해요 (힌트 3셀)');return}
 S.cells-=3;S.ledger.unshift({t:'리코의 힌트',a:-3});M.hint=true;SFX.coin();
 if(c.m.type==='mc'){const ai=ansIdx(c),w=[0,1,2,3].filter(i=>i!==ai&&!c.gone.includes(i));c.gone.push(pick(w));toast('리코: 이건 확실히 아니야!')}
 else{c.picked=[0];c.fixed=1;toast('리코: 첫 단계는 이거야!')}
 renderMission();save()}
function submitChoice(i){
 if(!M||!M.cur||M.cur.done)return;const c=M.cur;if(c.m.type==='order')return;c.done=true;timerStop();const ai=ansIdx(c);
 $$('.ch').forEach((b,k)=>{b.disabled=true;if(k===ai)b.classList.add('right');else if(k===i)b.classList.add('wrong')});SFX.click();
 const info={ok:i===ai,timeout:i<0,my:i<0?'(시간 초과)':choicesOf(c)[i]};setTimeout(()=>{if(M&&M.cur===c)resolve(info)},450)}
function submitOrder(timeout){
 if(!M||!M.cur||M.cur.done)return;const c=M.cur,n=c.m.steps.length;if(!timeout&&c.picked.length<n)return;c.done=true;timerStop();
 const ok=c.picked.length===n&&c.picked.every((x,k)=>x===k);$$('.slot').forEach((b,k)=>b.classList.add(c.picked[k]===k?'right':'wrong'));SFX.click();
 setTimeout(()=>{if(M&&M.cur===c)resolve({ok,timeout:!!timeout&&!ok})},500)}
function resolve(info){
 const c=M.cur,atk=c.kind==='atk';let dmg=0,lost=0;
 if(atk){M.tries++;if(info.ok){dmg=Math.round(power()*M.combo);M.gauge=Math.max(0,M.gauge-dmg);M.combo=1;M.hits++}}
 else{M.dtries++;if(info.ok){M.combo=Math.min(2,Math.round((M.combo+.2)*10)/10);M.dodges++}else{lost=M.st.boss?20:15;M.energy=Math.max(0,M.energy-lost)}}
 Object.assign(info,{dmg,lost,atk});M.last={...info,m:c.m};
 if(M.gauge<=0)M.over={win:true};else if(M.energy<=0)M.over={win:false,why:'energy'};
 updatePanels();timerStop();hideCallout();sceneFx(info);renderReveal(info,c);setRound('결과')}
function renderReveal(i,c){
 const m=c.m,right=m.type==='order'?m.steps.map((s,k)=>`${k+1}. ${s}`).join('  →  '):choicesOf(c)[ansIdx(c)];
 const [vt,vc]=i.ok?['✔ 성공!','ok']:i.timeout?['⏱ 시간 초과','bad']:['✖ 아쉬워요','bad'];
 const hd=i.atk?(i.ok?`${c.skill.name} 명중! 게이지 -${i.dmg}`:'빗나갔어요. 게이지는 그대로예요.'):(i.ok?`피했다! 다음 공격 콤보 ×${M.combo.toFixed(1)}`:`공격을 맞았어요… 에너지 -${i.lost}`);
 $('#bottom').innerHTML=`<div class="bp"><div class="box"><span class="vchip ${vc}">${vt}</span><div class="hd">${esc(hd)}</div>
 <div class="src"><b>📘 해설</b><q>${esc(m.ex)}</q></div><div class="ans"><b>정답:</b> ${esc(right)}${i.my&&m.type!=='order'?` &nbsp;·&nbsp; <b>내 답:</b> ${esc(i.my)}`:''}</div>
 ${i.ok?'':'<div class="ans" style="color:#7a5a00">틀려도 괜찮아요! 해설을 읽고 다음에 맞혀 봐요.</div>'}</div>
 <div class="box" style="display:grid;gap:10px;align-content:start"><button class="go bl" data-act="next" id="nextBtn">${M.over?'결과 보기 ▶':'다음 ▶'}</button><button class="sm" style="justify-self:center" data-act="report">이 미션 신고하기</button></div></div>`;
 setTimeout(()=>{const b=$('#nextBtn');b&&b.focus()},100)}
function next(){
 if(!M)return;if(M.over)return finish(M.over.win,M.over.why);M.cur=null;
 if(M.turn==='me')M.turn='opp';else{if(M.round>=M.st.r){M.over={win:false,why:'rounds'};return finish(false,'rounds')}M.round++;M.turn='me'}

/* ---------- scene effects ---------- */
const spEl=k=>$(k==='me'?'#sprMe':'#sprOpp');
function lunge(k){const e=spEl(k);e.classList.remove('lungeme','lungeopp');e.offsetHeight;e.classList.add(k==='me'?'lungeme':'lungeopp');setTimeout(()=>e.classList.remove('lungeme','lungeopp'),600)}

const POS={me:'left:16%;top:30%',opp:'right:10%;top:6%'};
function pop(k,text,cls=''){const d=document.createElement('div');d.className='pop '+cls;d.style.cssText=POS[k];d.textContent=text;$('#fx').appendChild(d);setTimeout(()=>d.remove(),2600)}

function sceneFx(i){const id=M.id,ov=M.over;setTimeout(()=>{if(!alive(id))return;
 if(i.atk){if(i.ok){SFX.hit();hitFx('opp');pop('opp',`-${i.dmg}!`);sparks('opp')}else{SFX.bad();pop('opp','빗나감','unk')}}
 else{if(i.ok){SFX.block();pop('me','회피!');sparks('me')}else{SFX.hit();hitFx('me');pop('me',`-${i.lost}`,'bad')}}
 if(ov)setTimeout(()=>{if(!alive(id)||CUR!=='battle')return;if(ov.win){spEl('opp').classList.add('ko');splash('잠재웠다!')}else splash('에너지 0','괜찮아, 다시 도전!')},1100)},300)}

/* ---------- finish: stars + XP/level + new skill + reward mail (one transaction in the final) ---------- */
function finish(win,why){
 const m=M,st=m.st,d=today();timerStop();musicStop();$('#splash').hidden=true;
 const R={win,why,stars:0,xp:0,cells:0,base:0,first:0,capped:false,ups:[],newSkills:[],unlockedNext:false,food:false};
 if(win){
  R.stars=m.energy>=80?3:m.energy>=50?2:1;const prev=S.stars[st.id]||0;S.stars[st.id]=Math.max(prev,R.stars);R.unlockedNext=!prev&&st.id<7;
  R.xp=st.boss?100:30+10*R.stars;if(S.foodDay===d){R.xp=Math.round(R.xp*1.1);R.food=true}
  S.xp+=R.xp;while(S.xp>=100){S.xp-=100;S.lv++;R.ups.push(S.lv);SKILLS.filter(s=>s.unlock===S.lv).forEach(s=>{R.newSkills.push(s);if(!S.learned.includes(s.id))S.learned.push(s.id)})}
  if(S.battlesToday>=10||S.cellsToday>=60)R.capped=true;
  else{R.base=st.boss?20:[0,5,10,15][R.stars];R.first=S.firstToday?5:0;R.cells=Math.min(R.base+R.first,60-S.cellsToday);
   S.cellsToday+=R.cells;S.battlesToday++;S.firstToday=false;
   S.mails.unshift({id:'r'+Date.now(),icon:st.boss?'👑':'⭐',title:`[코덱스의 시험] ${st.name} 클리어 보상`,sub:`${'★'.repeat(R.stars)} ${R.base}셀${R.first?' + 오늘 첫 클리어 5셀':''} · 방금 전`,amount:R.cells,claimed:false})}
  S.justCleared=true}
 M.R=R;save();renderResult();go('result');
 if(win){SFX.win();confetti()}else SFX.lose();setTimeout(()=>{const x=$('#xpFill');x&&(x.style.width=S.xp+'%')},60)}
function confetti(){const c=$('.conf');if(!c)return;const col=['#fbbf24','#3b82f6','#14b8a6','#f472b6','#a78bfa','#fff'];
 c.innerHTML=Array.from({length:46},()=>`<i style="left:${rnd(0,100)}%;background:${pick(col)};animation-duration:${rnd(3,7)}s;animation-delay:${rnd(0,4)}s"></i>`).join('')}
function renderResult(){

 const starWhy=m.energy>=80?'남은 에너지 80 이상 → ★★★':m.energy>=50?'남은 에너지 50 이상 → ★★ (80 이상이면 ★★★)':'클리어 → ★ (에너지 50 이상이면 ★★)';
 $('#s-result').innerHTML=`<div class="conf"></div><div class="rin"><div class="rl"><div class="big ${win?'':'l'}">${win?'클리어!':'다시 도전!'}</div>
 ${win?`<div class="stars3">${'★'.repeat(R.stars)}<span>${'★'.repeat(3-R.stars)}</span></div>`:''}
 <div class="sp" style="aspect-ratio:1;height:180px">${sSpirit(win?'white':'yellow')}</div>
 <div class="vsl">${esc(S.name)} <em>에너지 ${m.energy}</em> &nbsp;·&nbsp; ${esc(st.an)} <i>게이지 ${m.gauge}</i></div><div style="opacity:.8;font-size:13px;margin-top:4px">${win?starWhy:why}</div></div>
 <div class="rr"><div class="box"><h5>📊 이번 배틀</h5><div class="st3"><div class="a">미션 성공<b>${m.hits} / ${m.tries}</b></div><div class="b">회피 성공<b>${m.dodges} / ${m.dtries}</b></div><div class="c">남은 에너지<b>${m.energy}</b></div></div></div>
 ${win?`<div class="box"><h5>🎁 보상</h5><div class="rw"><span>경험치${R.food?' (먹이 효과 +10%)':''}</span><b>+${R.xp} XP</b></div>
 ${R.capped?'<div class="rw"><span>셀</span><b>오늘 보상 한도(10판 · 60셀)에 도달했어요</b></div>':`<div class="rw"><span>${st.boss?'보스 클리어':stars(R.stars)+' 클리어'}</span><b>${R.base}셀</b></div>${R.first?'<div class="rw"><span>오늘 첫 클리어 보너스</span><b>+5셀</b></div>':''}<div class="rw t"><span>합계</span><span>${R.cells}셀 → 우편함으로 보냈어요 ✉</span></div>`}</div>
 <div class="box"><h5>정령 <b>Lv.${S.lv}</b> <span style="float:right;color:var(--mute)">${S.xp} / 100 XP</span></h5>

 :`<div class="box"><h5>💬 네이티</h5><div style="font-size:13px">괜찮아! 실패해도 잃는 건 하나도 없어. 다른 스킬을 써 보거나, O/X 회피로 콤보를 모아서 한 방에 크게 때려 보자!</div></div>`}
 <div class="rbtns" style="margin-top:12px">${win?`${R.cells?'<button class="btn" data-act="go" data-to="mail">✉ 우편함 열기</button>':''}${nx?`<button class="btn out" data-act="stage" data-id="${nx.id}">다음: ${nx.name} ▶</button>`:''}`:`<button class="btn" data-act="stage" data-id="${st.id}">다시 도전</button>`}

 modal(`<h3>🚩 이 미션을 신고할까요?</h3><p style="margin:0 0 6px;color:var(--mute)">${esc(m.prompt)}</p>${['정답이 틀린 것 같아요','문제가 이상해요','부적절한 내용이 있어요','기타'].map((r,i)=>`<label class="opt"><input type="radio" name="rr" value="${r}" ${i?'':'checked'}>${r}</label>`).join('')}
 <div class="row"><button class="btn out" data-act="close">취소</button><button class="btn" data-act="sendReport" data-id="${m.id}">신고하기</button></div>`)}
function exitModal(){modal(`<h3>배틀에서 나갈까요?</h3><p>이번 배틀은 기록되지 않아요. <b>벌칙은 없어요.</b></p><div class="row"><button class="btn out" data-act="close">계속하기</button><button class="btn" style="background:var(--red);box-shadow:0 3px 0 #b91c1c" data-act="forfeit">나가기</button></div>`)}
const ACT={
 go:b=>{SFX.click();if(b.dataset.to!=='mail')lastClaim=null;go(b.dataset.to)},
 play:()=>{SFX.click();lastClaim=null;if(S.onboarded)go('map');else{OB=0;OBtap=0;go('onboard')}},
 soon:()=>toast('이 데모에서는 미니게임 탭만 사용할 수 있어요'),
 soonGame:()=>toast('타자 연습은 이번 데모에 포함되지 않았어요'),
 menu:()=>{menuOpen=!menuOpen;rerender()},
 sound:()=>{setSound(!AU.on);if(AU.on)SFX.click();if(CUR!=='battle'){menuOpen=false;rerender()}toast(AU.on?'소리 켜짐':'소리 꺼짐')},
 reset:()=>{S=freshState();MISS=defMiss();rollDay();lastClaim=null;M=null;toast('데모를 처음 상태로 되돌렸어요');go('hub')},
 nextDay:()=>{S.dayOff=(S.dayOff||0)+1;rollDay();menuOpen=false;save();rerender();toast('하루가 지났어요 (데모) · 오늘 보상 횟수가 초기화됐어요')},
 filter:b=>{hubFilter=b.dataset.f;renderHub()},
 ob:b=>{SFX.click();OB=+b.dataset.s;renderOnboard()},
 tapSprout:()=>tapSprout(),
 nameOk:()=>{const v=($('#spName').value||'').trim().slice(0,8);S.name=v||'루미';SFX.click();OB=3;renderOnboard()},
 obDone:()=>{S.onboarded=true;S.hatchDay=today();SFX.splash();save();go('map');toast(`${jo(S.name,'과','와')} 함께 1장을 시작해요!`)},
 stage:b=>{SFX.click();openStage(+b.dataset.id)},
 feed:()=>feed(),
 beginBattle:()=>{ac();beginBattle()},
 pickSkill:b=>{SEL=+b.dataset.i;SFX.sel();renderSkills()},
 useSkill:()=>useSkill(SEL),
 choice:b=>submitChoice(+b.dataset.i),
 ordPick:b=>ordPick(+b.dataset.x),unpick:b=>unpick(+b.dataset.k),ordReset:()=>ordReset(),ordOk:()=>submitOrder(false),
 hint:()=>useHint(),
 next:()=>{SFX.click();next()},
 report:()=>reportModal(),
 sendReport:b=>{const r=($('input[name=rr]:checked')||{}).value||'기타';S.reports.push({m:b.dataset.id,reason:r,who:'별빛코더'});closeModal();toast('신고가 접수됐어요. 운영팀이 확인할 거예요');save()},
 exit:()=>exitModal(),
 forfeit:()=>{closeModal();const id=M&&M.st.id;M=null;go('map');if(id)toast('배틀에서 나왔어요. 언제든 다시 도전할 수 있어요')},
 close:()=>closeModal(),
 modalbg:(b,e)=>{if(e.target===b)closeModal()},
 claim:b=>doClaim([b.dataset.id]),
 claimAll:()=>doClaim(S.mails.filter(m=>!m.claimed&&m.amount).map(m=>m.id)),
 buy:b=>buy(b.dataset.id),equip:b=>equip(b.dataset.id),
 admF:b=>{admF=b.dataset.f;renderAdmin()},
 tAdd:()=>tEditModal(),tEdit:b=>{closeModal();tEditModal(b.dataset.id)},tSave:b=>tSave(b.dataset.id),tSet:b=>tSet(b.dataset.id,b.dataset.s),
 tReports:()=>tReports(),
 clearReports:()=>{S.reports=[];save();closeModal();renderAdmin()}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(menuOpen&&!e.target.closest('.me-menu')){menuOpen=false;if(!b)rerender()}
 if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){ac();f(b,e)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
 if(CUR==='onboard'&&e.key==='Enter'&&e.target.id==='spName'){ACT.nameOk();return}
 if(CUR!=='battle'||!M||!$('#modal').hidden)return;
 const k=e.key;
 if(M.cur&&!M.cur.done&&M.cur.m.type!=='order'&&$$('.ch').length){const n={1:0,2:1,3:2,4:3,o:0,O:0,x:1,X:1}[k];const bs=$$('.ch');if(n!==undefined&&n<bs.length&&!bs[n].classList.contains('gone'))submitChoice(n)}
 else if($('.cards')&&/^[1-4]$/.test(k)){SEL=+k-1;SFX.sel();renderSkills()}
 else if($('.cards')&&k==='Enter'){e.preventDefault();useSkill(SEL)}
 else if(k==='Enter'&&$('#nextBtn')&&document.activeElement.id!=='nextBtn')next()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else if(CUR==='battle'&&M&&!M.over)musicStart()});

/* ---------- boot ---------- */
load();go('hub');
</script>
</html>
